<!DOCTYPE html>
<html lang="es"
head> 
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>suma</title>

     <link rel="stylesheet"
           href="{{ url_for('static', filename='css/estilos.css') }}">
<body> 

    <header class="encabezado">
        <h1>Calculadora basica con flask</h1>

        <nav class="menu"> 
            <a href="/suma">Suma</a>
            <a href="/resta">resta</a>
            <a href="/multiplicacion">Multiplicacion</a>
            <a href="/division">division</a>
        </nav>
</header> 

<main class="contenedor">
    <section class="tarjeta-operacion">
    <h2>suma</h2>

    <form method="POST">
        <form method="POST">
            <label for="numero1">Primer número</label>
        <input id="numero1" name="numero1"
                   type="number" step="any" required>

            <label for="numero2">Segundo número</label>
            <input id="numero2" name="numero2"
                   type="number" step="any" required>

            <button class="boton" type="submit">
                Calcular suma
            </button>
        </form>

        {% if resultado is not none %}
            <p class="resultado">
                Resultado: {{ resultado }}
            </p>
        {% endif %}
    </section>
</main>
</body>
</html>
